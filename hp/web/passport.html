<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harvest passport</title><link rel="stylesheet" href="/style.css"></head><body><div class="w">
<header class="top"><div class="logo"><i>H</i>HarvestProof passport</div></header><p class="mu sm" style="margin-bottom:14px">This page lets a buyer check when a crop became safe to harvest, and whether the record was altered.</p><div id="o" class="col">Loading...</div>
<footer>Advice only, not a laboratory certificate. Safe harvest day is the last spray date plus the longest official label waiting period.</footer></div>
<script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=d=>new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
(async()=>{const t=location.pathname.split('/').pop(),r=await fetch('/api/public/passport/'+t);if(!r.ok){o.innerHTML='<div class="note bad">Passport not found.</div>';return}
const d=await r.json(),p=JSON.parse(d.payload),v=await (await fetch('/api/public/passport/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})).json();
o.innerHTML=`<div class="note ${v.valid?'ok':'bad'}"><b>${v.valid?'✓ Signature valid: this record has not been altered':'✗ Signature does not match: do not trust this record'}</b><br><span class="sm">Issued ${esc(fmt(p.issued))} for ${esc(p.owner)} · ID ${esc(p.id)}</span></div>`+
p.groups.map(g=>`<article class="pass ${g.hold_days?'hold':''}"><div class="row"><div class="sp"><h3>${esc(g.field)} · ${esc(g.crop)}</h3><p class="sm mu">Earliest safe harvest</p></div><div class="badge">${g.hold_days?'WAIT '+g.hold_days+' MORE DAYS':'CLEAR TO HARVEST'}</div></div><div class="bigdate">${esc(fmt(g.clear))}</div>
<ul class="tl">${g.sprays.map(s=>`<li><b>${esc(fmt(s.date))}: ${esc(s.product)}</b><span class="sm mu">Dose ${esc(s.dose)} · wait ${s.wait} days · batch ${esc(s.batch)}</span><span class="eu ${esc(s.eu.level)}">${esc(s.eu.text)}</span></li>`).join('')}</ul></article>`).join('')+
`<div><img alt="QR code for this passport" width="130" height="130" src="/api/qr.png?text=${encodeURIComponent(location.href)}"></div>`})()</script></body></html>
